name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netscope-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules
        run: go mod verify

      - name: Run static checks
        run: go vet ./...

      - name: Run Go tests
        run: go test ./...

      - name: Validate Protocol 1.x contracts and trust invariants
        run: go test ./internal/contracttest ./internal/agents ./internal/artifacts

      - name: Build server
        run: go build -trimpath ./cmd/server

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck and build
        run: npm run build

  migrations:
    name: PostgreSQL migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: netscope
          POSTGRES_USER: netscope
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netscope -d netscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Apply migrations
        shell: bash
        env:
          PGPASSWORD: ci-only-password
        run: |
          for migration in backend/migrations/*.up.sql; do
            psql --host localhost --username netscope --dbname netscope \
              --set ON_ERROR_STOP=on --file "$migration"
          done

  containers:
    name: Container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, frontend, migrations]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build --file Dockerfile.backend --tag netscope-backend:ci .

      - name: Build frontend image
        run: docker build --file Dockerfile.frontend --tag netscope-frontend:ci .
